services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bizovix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bizovix_dev_local}
      POSTGRES_DB: bizovix_contractor_erp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizovix -d bizovix_contractor_erp_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://bizovix:${POSTGRES_PASSWORD:-bizovix_dev_local}@postgres:5432/bizovix_contractor_erp_db
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      APP_PORT: 4000
      APP_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
