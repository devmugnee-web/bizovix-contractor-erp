appId: com.bizovix.contractor-erp
productName: Bizovix Contractor ERP
directories:
  output: release
afterPack: scripts/after-pack.cjs
files:
  - dist/**
  - "!**/*.map"
extraResources:
  - from: ../local-service
    to: apps/desktop/local-service
    filter:
      - src/**
      - package.json
  - from: ../../../packages/desktop-storage
    to: packages/desktop-storage
    filter:
      - src/**
      - package.json
  - from: desktop-config.json
    to: desktop-config.json
win:
  target: nsis
nsis:
  perMachine: false
  deleteAppDataOnUninstall: false
mac:
  target: dmg
  category: public.app-category.business
linux:
  target: AppImage
  category: Office
